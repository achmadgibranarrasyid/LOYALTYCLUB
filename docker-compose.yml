services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      NODE_ENV: production
      TRUST_PROXY: "1"
      BREWCLUB_DATABASE: /app/data/customers.sqlite3
    expose:
      - "8000"
    volumes:
      - brewclub-data:/app/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      BREWCLUB_DOMAIN: ${BREWCLUB_DOMAIN:?Set BREWCLUB_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  brewclub-data:
  caddy-data:
  caddy-config:
