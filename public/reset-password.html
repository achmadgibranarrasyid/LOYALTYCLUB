<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atur Ulang Kata Sandi — MONT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav"><div class="nav-inner"><a href="index.html" class="logo" aria-label="MONT"><img class="brand-logo" src="MONT%20NEON%20BOX.png" alt="MONT"></a></div></nav>
<main class="page-wrapper">
  <section class="auth-box">
    <form class="form" id="resetForm">
      <h1>Atur kata sandi baru</h1>
      <p class="sub">Gunakan kata sandi minimal 12 karakter.</p>
      <label for="newPassword">Kata sandi baru</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <label for="confirmPassword">Ulangi kata sandi</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <button class="btn btn-primary full" type="submit">Simpan kata sandi</button>
      <p class="err" id="resetError" role="alert"></p>
      <a class="auth-link" href="login.html">Kembali ke login</a>
    </form>
  </section>
</main>
<script src="customer-api.js"></script>
<script>
const resetToken = new URLSearchParams(window.location.hash.slice(1)).get('token');
window.history.replaceState({}, '', window.location.pathname);
document.getElementById('resetForm').addEventListener('submit', async event => {
  event.preventDefault();
  const error = document.getElementById('resetError');
  const password = document.getElementById('newPassword').value;
  if (!resetToken) {
    error.textContent = 'Tautan pengaturan ulang tidak valid atau sudah kedaluwarsa.';
    return;
  }
  if (password !== document.getElementById('confirmPassword').value) {
    error.textContent = 'Kata sandi tidak sama.';
    return;
  }
  try {
    await resetCustomerPassword(resetToken, password);
    error.textContent = 'Kata sandi diperbarui. Silakan masuk.';
    window.history.replaceState({}, '', 'reset-password.html');
    window.setTimeout(() => { window.location.href = 'login.html'; }, 1200);
  } catch (requestError) {
    error.textContent = requestError.message;
  }
});
</script>
</body>
</html>
