<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartu Member — BrewClub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="page-account">

<!-- ================= NAV AKUN ================= -->
<nav class="nav account-nav">
  <div class="nav-inner">
    <a href="index.html" class="logo" aria-label="MONT"><img class="brand-logo" src="mont-logo.svg" alt="MONT"></a>
    <div class="nav-actions" style="margin-left: auto;">
      <a href="index.html" class="btn btn-ghost hide-xs">Lihat Promo</a>
      <button class="btn btn-ghost danger" id="btnLogout">Keluar</button>
    </div>
  </div>
</nav>

<!-- ================= KONTEN AKUN ================= -->
<main class="account-wrapper">
  
  <!-- Header Profil -->
  <div class="profile-header">
    <div class="profile-avatar" id="profileAvatar">A</div>
    <div class="profile-info">
      <h1 id="profileName">Memuat...</h1>
      <p>Member sejak <span id="profileJoinDate">—</span></p>
    </div>
  </div>

  <!-- Kartu Digital -->
  <div class="digital-card">
    <div class="dc-top">
      <span class="dc-brand"><img class="brand-logo" src="mont-logo.svg" alt="MONT"></span>
      <span class="dc-status">MEMBER AKTIF</span>
    </div>
    
    <div class="dc-qr-wrapper">
      <img id="qrCodeImage" class="member-qr" alt="QR Code member yang dapat dipindai" width="240" height="240">
    </div>

    <div class="dc-bottom">
      <div>
        <small>NAMA MEMBER</small>
        <strong id="cardName">—</strong>
      </div>
      <div style="text-align: right;">
        <small>ID MEMBER</small>
        <strong id="cardId">—</strong>
      </div>
    </div>
  </div>

  <!-- Panduan Singkat -->
  <div class="account-tips">
    <div class="tip-icon">💡</div>
    <div>
      <h4>Cara Klaim Diskon</h4>
      <p>QR Code ini berisi ID Member dan dapat dipindai oleh kasir. Sebutkan promo yang ingin kamu klaim (contoh: Diskon 20% Pastry) untuk diproses.</p>
    </div>
  </div>

  <!-- Tombol Navigasi Cepat -->
  <div class="account-actions">
    <a href="index.html#diskon" class="btn btn-primary full">Lihat Katalog Diskon</a>
    <a href="index.html#bundling" class="btn btn-ghost full">Lihat Paket Bundling</a>
  </div>

</main>

<div id="toast"></div>
<script src="customer-api.js"></script>
<script src="script.js"></script>
</body>
</html>
